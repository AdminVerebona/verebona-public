<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/app-icon.png" />
    <link rel="apple-touch-icon" href="/assets/app-icon.png" />

    <!-- Polices auto-hébergées : préchargement des deux fichiers latin
         utilisés au-dessus de la ligne de flottaison (titres + texte).
         Les @font-face sont dans src/fonts.css. -->
    <link rel="preload" href="/fonts/bricolage-grotesque-latin-opsz-5.3.0.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-sans-latin-wght-5.3.0.woff2" as="font" type="font/woff2" crossorigin />

    <!-- SEO de base -->
    <!-- Titre et description de l'accueil : valeurs imposées au build par
         vite.config.ts depuis src/config/head.rules.ts (une seule occurrence
         de chaque). Les autres routes reçoivent dist/spa.html. -->
    <title>Verebona | Documents et suivi de vos biens</title>
    <meta name="description" content="Découvrez Verebona : documents, garanties et échéances de vos biens réunis pour simplifier leur suivi, de l’achat à la revente. Disponible bientôt." />
    <link rel="canonical" href="https://www.verebona.fr/" />

    <!-- Open Graph (LinkedIn, Facebook, WhatsApp, Slack…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Verebona" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://www.verebona.fr/" />
    <meta property="og:title" content="Verebona — Centralisez, organisez, valorisez vos biens" />
    <meta
      property="og:description"
      content="Centralisez vos biens, documents et échéances. Retrouvez tout facilement, anticipez les dates importantes et valorisez votre patrimoine."
    />
    <meta property="og:image" content="https://www.verebona.fr/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Verebona — gestion de patrimoine" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Verebona — Centralisez, organisez, valorisez vos biens" />
    <meta
      name="twitter:description"
      content="Centralisez vos biens, documents et échéances. Retrouvez tout facilement, anticipez les dates importantes et valorisez votre patrimoine."
    />
    <meta name="twitter:image" content="https://www.verebona.fr/assets/og-image.png" />

    <!-- Animation d'apparition : la classe est posée avant la première
         peinture pour que les blocs animés du HTML pré-rendu n'apparaissent
         pas puis disparaissent au démarrage de Vue. Filet de sécurité : tout
         est révélé après 3 s même si le JavaScript de l'application échoue.
         (Même règle que src/composables/useScrollReveal.ts.) -->
    <script>
      (function () {
        var d = document.documentElement
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
        d.classList.add('vb-anim')
        setTimeout(function () {
          document.querySelectorAll('.vb-reveal, .vb-rgroup > *').forEach(function (e) { e.classList.add('vb-in') })
        }, 3000)
      })()
    </script>

    <!-- Divers -->
    <meta name="theme-color" content="#0B1324" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
