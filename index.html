<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon (lot 71H, charte Sérénité) : tuile pétrole #17474D, cases
         ivoire #F8F6F1, cube cuivre #D66B53 — lisible sur onglet clair comme
         sombre (l'ancien logo-petrole.svg, transparent, disparaissait sur
         onglet sombre). `?v=` force le rechargement des icônes en cache. -->
    <link rel="icon" href="/favicon.ico?v=71h" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=71h" />
    <link rel="apple-touch-icon" href="/assets/app-icon.png?v=71h" />

    <!-- Police auto-hébergée (charte 2026 : Figtree seule) : préchargement du
         fichier latin, utilisé dès le premier écran. Les @font-face sont dans
         src/fonts.css. -->
    <link rel="preload" href="/fonts/figtree-latin-wght-5.3.0.woff2" as="font" type="font/woff2" crossorigin />

    <!-- SEO de base -->
    <!-- Titre et description de l'accueil : valeurs imposées au build par
         vite.config.ts depuis src/config/head.rules.ts (une seule occurrence
         de chaque). Les autres routes reçoivent dist/spa.html. -->
    <title>Verebona | Documents et suivi de vos biens</title>
    <meta name="description" content="Découvrez Verebona : documents, garanties et échéances de vos biens réunis pour simplifier leur suivi, de l’achat à la revente. Disponible bientôt." />
    <!-- Canonical, Open Graph et Twitter de l'accueil : générés au build par
         vite.config.ts depuis src/config/social.rules.ts (CDC Données
         structurées §6 : valeurs centralisées). Chaque page d'aide reçoit
         les siennes au pré-rendu (scripts/prerender.mjs). -->
    <!--vb:head-meta-->

    <!-- Divers -->
    <meta name="theme-color" content="#F8F6F1" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
